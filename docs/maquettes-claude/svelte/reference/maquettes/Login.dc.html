<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input,textarea,select{font-family:inherit}
.press{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.press:active{transform:scale(.97)}
.fld:focus-within{border-color:#1db954 !important;box-shadow:0 0 0 4px rgba(29,185,84,.14) !important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes areaIn{from{opacity:0}to{opacity:1}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ringIn{from{stroke-dasharray:0 1000}}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(150px);opacity:0}}
.screen{animation:screenIn .24s ease-out both}
.fx{animation:fadeUp .28s ease-out both}
.sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both}
.scrim{animation:scrimIn .24s ease-out both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:drawIn .9s cubic-bezier(.3,.7,.2,1) .15s both}
.area{animation:areaIn .6s ease-out .45s both}
.hbar{transform-origin:left;animation:barIn .6s cubic-bezier(.2,.8,.2,1) .15s both}
.vbar{transform-origin:bottom;animation:barUp .6s cubic-bezier(.2,.8,.2,1) .15s both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(22px,-26px) scale(1.07)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-26px,20px) scale(1.05)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(29,185,84,.28)}70%{box-shadow:0 0 0 16px rgba(29,185,84,0)}100%{box-shadow:0 0 0 0 rgba(29,185,84,0)}}
@keyframes shimmer{0%,62%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}
@keyframes logoIn{from{opacity:0;transform:scale(.7) rotate(-12deg)}to{opacity:1;transform:none}}
.lf{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease,background-color .2s ease}
.lf:focus-within{border-color:#1db954 !important;box-shadow:0 0 0 4px rgba(29,185,84,.14),0 10px 24px -14px rgba(29,185,84,.5) !important;transform:translateY(-1px);background:#FFFFFF !important}
.lf:focus-within .lic{color:#1db954 !important}
.cta{transition:transform .15s ease,box-shadow .25s ease}
.cta:hover{box-shadow:0 22px 38px -14px rgba(23,163,73,.7) !important}
.cta:active{transform:scale(.98)}
.cta .arr{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.cta:hover .arr,.cta:active .arr{transform:translateX(4px)}
.lnk{transition:opacity .15s ease}
.lnk:active{opacity:.6}
</style>
</helmet>
<div class="screen" style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#0F1512;font-family:'Lato',system-ui,sans-serif"><div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg,#e8fef0 0%,#f3fcf7 42%,#FFFFFF 100%)"></div><div aria-hidden="true" style="position:absolute;left:-90px;top:-70px;width:300px;height:300px;border-radius:150px;background:radial-gradient(circle at 40% 40%,rgba(29,185,84,.28),rgba(29,185,84,0) 70%);animation:floatA 16s ease-in-out infinite"></div><div aria-hidden="true" style="position:absolute;right:-110px;top:300px;width:320px;height:320px;border-radius:160px;background:radial-gradient(circle at 50% 50%,rgba(61,220,132,.24),rgba(61,220,132,0) 70%);animation:floatB 20s ease-in-out infinite"></div><div aria-hidden="true" style="position:absolute;left:-60px;bottom:-110px;width:300px;height:300px;border-radius:150px;background:radial-gradient(circle at 50% 50%,rgba(29,185,84,.18),rgba(29,185,84,0) 70%);animation:floatA 22s ease-in-out infinite reverse"></div><div style="position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:54px 0 12px;box-sizing:border-box"><div style="position:relative;margin:0 20px;flex-shrink:0;padding:30px 22px 22px;border-radius:38px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(15,21,18,.04),0 40px 80px -30px rgba(23,163,73,.35),0 20px 40px -24px rgba(15,21,18,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both">
  <div style="display:flex;justify-content:center"><span style="width:88px;height:88px;border-radius:44px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -14px rgba(29,185,84,.55),0 0 0 8px #e8fef0;animation:ringPulse 3.6s ease-out 1s infinite,logoIn .6s cubic-bezier(.2,.8,.2,1) .15s both"><img src="../assets/logo-g-login.png" alt="G-FLUX" style="width:54px;height:54px;object-fit:contain"></span></div>
  <h1 style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 200ms both;margin:22px 0 0;text-align:center;font-size:28px;font-weight:900;letter-spacing:-0.035em;line-height:1.1">Connexion à G-FLUX</h1>
  <p style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 260ms both;margin:8px 8px 0;text-align:center;font-size:15px;line-height:1.45;color:#66716B">Accédez à votre espace coach ou à votre espace client.</p>
  <div style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 320ms both;margin-top:20px;position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:24px;background:#F3F6F4">
    <span aria-hidden="true" style="position:absolute;top:4px;bottom:4px;left:{{indL}};width:calc(50% - 4px);border-radius:20px;background:#e8fef0;border:1.5px solid rgba(29,185,84,.3);box-sizing:border-box;box-shadow:0 8px 16px -10px rgba(29,185,84,.6);transition:left .28s cubic-bezier(.2,.8,.2,1)"></span>
    <button class="press" onClick="{{pickCoach}}" style="position:relative;height:46px;padding:0;border:0;background:transparent;color:{{coachFg}};font-size:15px;font-weight:{{coachFw}};display:flex;align-items:center;justify-content:center;gap:8px;transition:color .2s ease"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M10 20V4M15 20v-8M20 20V8"></path></svg>Espace coach</button>
    <button class="press" onClick="{{pickClient}}" style="position:relative;height:46px;padding:0;border:0;background:transparent;color:{{clientFg}};font-size:15px;font-weight:{{clientFw}};display:flex;align-items:center;justify-content:center;gap:8px;transition:color .2s ease"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3 19c.8-3.200 3.200-4.800 6-4.800s5.200 1.600 6 4.800"></path><path d="M16 5.500a3 3 0 0 1 0 6M18 14.500c1.800.6 3 2.200 3.500 4.500"></path></svg>Espace client</button>
  </div>
  <div style="margin-top:20px"><div style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 380ms both;"><div style="font-size:14.5px;font-weight:900;margin-bottom:8px">Adresse e-mail</div><label class="lf" style="display:flex;align-items:center;gap:12px;height:56px;box-sizing:border-box;padding:0 8px 0 16px;border-radius:18px;border:1.5px solid #E3E8E5;background:#FBFCFB"><span class="lic" style="color:#7B857F;display:flex;transition:color .2s ease"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3"></rect><path d="M4 7.5l8 6 8-6"></path></svg></span><input type="email" value="{{email}}" onChange="{{setEmail}}" placeholder="votre@email.com" aria-label="Adresse e-mail" autocomplete="email" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:#0F1512;height:100%"></label></div></div>
  <div style="margin-top:14px"><div style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 440ms both;"><div style="font-size:14.5px;font-weight:900;margin-bottom:8px">Mot de passe</div><label class="lf" style="display:flex;align-items:center;gap:12px;height:56px;box-sizing:border-box;padding:0 8px 0 16px;border-radius:18px;border:1.5px solid #E3E8E5;background:#FBFCFB"><span class="lic" style="color:#7B857F;display:flex;transition:color .2s ease"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span><input type="{{ptype}}" value="{{pwd}}" onChange="{{setPwd}}" placeholder="Votre mot de passe" aria-label="Mot de passe" autocomplete="current-password" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:#0F1512;height:100%"><button type="button" class="press" onClick="{{toggleShow}}" aria-label="{{eyeLabel}}" style="width:44px;height:44px;padding:0;border:0;background:transparent;color:#7B857F;display:flex;align-items:center;justify-content:center"><sc-if value="{{eyeOff}}" hint-placeholder-val="{{ true }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if><sc-if value="{{eyeOn}}" hint-placeholder-val="{{ false }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5c1.700 0 3.200.5 4.500 1.200M21.500 12S18 18.500 12 18.500c-1.700 0-3.200-.5-4.500-1.200"></path><path d="M4 4l16 16"></path></svg></sc-if></button></label></div></div>
  <div style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 500ms both;display:flex;justify-content:flex-end;margin-top:2px"><button class="lnk" style="min-height:44px;padding:0;border:0;background:transparent;color:#1db954;font-size:14.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px">Mot de passe oublié ?</button></div>
  <div style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 540ms both;margin-top:2px"><a class="cta" href="Home.dc.html" style="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:60px;border-radius:30px;background:linear-gradient(135deg,#1db954,#1db954);color:#FFFFFF;font-size:17px;font-weight:900;letter-spacing:-0.01em;box-shadow:0 18px 32px -14px rgba(23,163,73,.75)"><span aria-hidden="true" style="position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));animation:shimmer 4.8s ease-in-out 1.6s infinite"></span><span style="position:relative">Se connecter</span><span class="arr" style="position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a></div>
  <div style="opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 600ms both;margin-top:18px;padding-top:16px;border-top:1px solid #EEF1EF;text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:900"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Accès sécurisé</div><div style="margin-top:4px;font-size:13px;color:#7B857F">Vos données personnelles restent protégées.</div></div>
</div></div><div style="position:relative;flex-shrink:0;display:flex;justify-content:center;padding:6px 0 max(34px,env(safe-area-inset-bottom));opacity:0;animation:fadeUp .6s ease-out 800ms both"><img src="../assets/wordmark-footer-login.png" alt="G-FLUX" style="height:26px;object-fit:contain"></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { role: 'coach', show: false, email: '', pwd: '' }; }
  renderVals() {
    const coach = this.state.role === 'coach';
    return {
      indL: coach ? '4px' : '50%',
      coachFg: coach ? '#0d7c36' : '#7B857F', clientFg: coach ? '#7B857F' : '#0d7c36',
      coachFw: coach ? 900 : 700, clientFw: coach ? 700 : 900,
      pickCoach: () => this.setState({ role: 'coach' }), pickClient: () => this.setState({ role: 'client' }),
      email: this.state.email, setEmail: (e) => this.setState({ email: e.target.value }),
      pwd: this.state.pwd, setPwd: (e) => this.setState({ pwd: e.target.value }),
      ptype: this.state.show ? 'text' : 'password', toggleShow: () => this.setState({ show: !this.state.show }),
      eyeLabel: this.state.show ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
      eyeOn: this.state.show, eyeOff: !this.state.show
    };
  }
}
</script>
</body>
</html>
