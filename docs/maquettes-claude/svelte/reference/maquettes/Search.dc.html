<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche · Tous les produits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input{font-family:inherit}
.press{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease}
.press:active{transform:scale(.97)}
.fld:focus-within{border-color:#1db954 !important;box-shadow:0 0 0 4px rgba(29,185,84,.14) !important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
.screen{animation:screenIn .24s ease-out both}
.li{animation:fadeUp .26s ease-out both}
.li:nth-child(1){animation-delay:30ms}
.li:nth-child(2){animation-delay:60ms}
.li:nth-child(3){animation-delay:90ms}
.li:nth-child(4){animation-delay:120ms}
.li:nth-child(5){animation-delay:150ms}
.li:nth-child(6){animation-delay:180ms}
.li:nth-child(7){animation-delay:210ms}
.li:nth-child(8){animation-delay:240ms}
.li:nth-child(9){animation-delay:270ms}
.li:nth-child(10){animation-delay:300ms}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="screen" style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#0F1512;font-family:'Lato',system-ui,sans-serif">

  <div style="padding:52px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <a class="press" href="Journal.dc.html" aria-label="Fermer" style="width:44px;height:44px;border-radius:22px;border:1px solid #E9EDEA;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 20px -8px rgba(15,21,18,.14);display:flex;align-items:center;justify-content:center;color:#0F1512">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin:0;font-size:18px;font-weight:900;letter-spacing:-0.01em">Ajouter un aliment</h1>
    <div style="width:44px;height:44px"></div>
  </div>

  <label class="fld" style="margin:18px 20px 0;height:52px;box-sizing:border-box;padding:0 16px;border-radius:16px;border:1px solid #E9EDEA;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 10px 28px -12px rgba(15,21,18,.14);display:flex;align-items:center;gap:10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#66716B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="text" placeholder="Rechercher un produit…" aria-label="Rechercher un produit" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:#0F1512">
  </label>

  <div style="display:flex;align-items:center;gap:8px;padding:16px 20px 12px;overflow-x:auto">
    <button class="press" aria-label="Favoris" aria-pressed="{{favOn}}" onClick="{{toggleFav}}" style="flex:none;width:44px;height:44px;padding:0;border-radius:22px;border:0;background:{{favBg}};color:{{favFg}};display:flex;align-items:center;justify-content:center;box-shadow:{{favShadow}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg>
    </button>
    <button class="press" aria-pressed="true" style="flex:none;height:44px;padding:0 18px;border-radius:22px;border:0;background:#1db954;color:#FFFFFF;font-size:14px;font-weight:700;box-shadow:0 8px 18px -8px rgba(23,163,73,.55)">Tous les produits</button>
    <a class="press" href="Main.dc.html" style="flex:none;height:44px;box-sizing:border-box;padding:0 20px;border-radius:22px;background:#F3F6F4;color:#3A4540;font-size:14px;font-weight:700;display:flex;align-items:center">Repas</a>
    <a class="press" href="Foods.dc.html" style="flex:none;height:44px;box-sizing:border-box;padding:0 18px;border-radius:22px;background:#F3F6F4;color:#3A4540;font-size:14px;font-weight:700;display:flex;align-items:center">Créés par moi</a>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:4px 20px 150px">

    <sc-if value="{{showHabits}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 12px">
        <h2 style="margin:0;font-size:12px;font-weight:900;letter-spacing:.12em;color:#66716B">TES ALIMENTS FRÉQUENTS</h2>
        <span style="font-size:13px;color:#66716B">tes habitudes</span>
      </div>
    </sc-if>

    <div class="li" style="border-radius:20px;border:1px solid #EEF1EF;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 12px 26px -16px rgba(15,21,18,.18);overflow:hidden">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="8">
        <div style="position:relative;display:flex;align-items:center;gap:11px;padding:7px 6px 7px 10px;border-top:{{p.border}}"><a href="Food-Detail.dc.html" aria-label="Voir la fiche de {{p.name}}" style="position:absolute;left:0;top:0;bottom:0;right:56px;z-index:1"></a>
          <sc-if value="{{p.hasImg}}" hint-placeholder-val="{{ true }}">
            <img src="{{p.img}}" alt="" style="width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:#F3F6F4">
          </sc-if>
          <sc-if value="{{p.noImg}}" hint-placeholder-val="{{ false }}">
            <div style="width:44px;height:44px;border-radius:12px;background:#e8fef0;color:#1db954;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3v5.5a2.5 2.5 0 0 0 5 0V3"></path><path d="M8 3v6.5M8 11v10"></path><path d="M17 21V3c-2.5 1.2-3.5 4-3.5 8H17"></path></svg>
            </div>
          </sc-if>
          <div style="flex:1;min-width:0">
            <div style="font-size:14.500px;font-weight:700;line-height:1.22;letter-spacing:-0.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{p.name}}<sc-if value="{{p.verified}}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1db954" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Produit vérifié" style="margin-left:6px;vertical-align:-1px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></div>
            <div style="margin-top:2px;font-size:12.500px;color:#66716B"><span style="font-size:13px;font-weight:700;color:#0d7c36">{{p.kcal}} kcal</span> · {{p.meta}}</div>
          </div>
          <sc-if value="{{p.hasHeart}}" hint-placeholder-val="{{ true }}">
            <button class="press" aria-label="Ajouter aux favoris" onClick="{{p.toggle}}" style="position:relative;z-index:2;width:44px;height:44px;padding:0;border-radius:22px;border:0;background:transparent;color:{{p.heartColor}};display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="{{p.heartFill}}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg>
            </button>
          </sc-if>
          <sc-if value="{{p.noHeart}}" hint-placeholder-val="{{ false }}"><div style="width:44px;flex:none"></div></sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,rgba(255,255,255,0),#FFFFFF 62%);pointer-events:none"></div>

  <nav aria-label="Mode d'ajout" style="position:absolute;left:20px;right:20px;bottom:28px;height:68px;box-sizing:border-box;padding:6px;border-radius:34px;background:#111A15;box-shadow:0 18px 40px -12px rgba(15,21,18,.55),0 2px 6px rgba(15,21,18,.2);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px">
    <button aria-current="true" style="border:0;border-radius:28px;background:rgba(255,255,255,.13);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;padding:0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      Recherche
    </button>
    <a href="Scanner.dc.html" style="border:0;border-radius:28px;background:transparent;color:rgba(255,255,255,.66);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;padding:0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6v12M7.5 6v12M11 6v12M14.5 6v12M18 6v12M20.5 6v12"></path></svg>
      Code-barres
    </a>
    <a href="Meal-AI.dc.html" style="position:relative;border:0;border-radius:28px;background:transparent;color:rgba(255,255,255,.66);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;padding:0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      Repas IA
      <span style="position:absolute;top:2px;right:12px;font-size:9px;font-weight:900;letter-spacing:.04em;color:#06361B;background:#1db954;border-radius:6px;padding:2px 5px">BÊTA</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { favOnly: false, favs: { mister: true, pouletdore: true, envia: true, lait: true, creme: true, calin: true, delilight: true, pepsi: true, galette: true, oldelpaso: true } };
  }
  renderVals() {
    const frequent = [
      { id: 'fromage', name: 'Fromage blanc nature 0%MG - 1kg', kcal: '50', meta: '100 g · U', img: '../assets/fromage.png', v: true, h: true },
      { id: 'pain', name: 'Pain complet ou intégral (à la farine T150)', kcal: '234', meta: '100 g', img: '', v: true, h: true },
      { id: 'compote', name: 'Compote Pomme', kcal: '51', meta: '100 g · LIDL', img: '', v: false, h: false },
      { id: 'choco', name: 'Chocolat noir 70 % de cacao environ, de d…', kcal: '591', meta: '100 g', img: '', v: true, h: true },
      { id: 'crisp', name: 'Country Crisp - Chocolat noir 70% cacao', kcal: '446', meta: '100 g · Jordans', img: '../assets/countrycrisp.png', v: true, h: true },
      { id: 'painblanc', name: 'Pain blanc (par ex. : baguette, boule...)', kcal: '287', meta: '100 g', img: '', v: true, h: true },
      { id: 'pouletroti', name: 'Blanc de Poulet - Rôti à la Broche', kcal: '104', meta: '100 g · Fleury Michon', img: '../assets/poulet.png', v: true, h: true },
      { id: 'yaourt', name: 'Yaourt ou lait fermenté, nature', kcal: '50,1', meta: '100 g', img: '', v: true, h: true },
      { id: 'miel', name: 'Miel', kcal: '331', meta: '100 g', img: '', v: true, h: true },
      { id: 'brasse', name: 'Yaourt brassé nature 0% matière grasse', kcal: '34', meta: '100 g · Auchan', img: '', v: true, h: true }
    ];
    const favorites = [
      { id: 'mister', name: 'Mister freeze', kcal: '47', meta: '100 g', img: '../assets/mister.png' },
      { id: 'pouletdore', name: 'Blanc de Poulet - Doré au Four', kcal: '100', meta: '100 g · Fleury Michon', img: '../assets/pouletdore.png' },
      { id: 'envia', name: 'fromage blanc 0%', kcal: '48', meta: '100 g · Envia', img: '../assets/envia.png' },
      { id: 'lait', name: 'Lait écrémé', kcal: '33', meta: '100 g · Délisse', img: '../assets/lait.png' },
      { id: 'creme', name: 'Crème dessert riche en protéines', kcal: '80', meta: '100 g · Envia, Lidl', img: '../assets/creme.png' },
      { id: 'calin', name: 'Câlin Extra 0%', kcal: '61', meta: '100 g · Yoplait', img: '../assets/calin.png' },
      { id: 'delilight', name: "Déli'light - Yaourt nature 0%", kcal: '45', meta: '100 g · Délisse, Marque Repère', img: '../assets/delilight.png' },
      { id: 'pepsi', name: 'Pepsi Max', kcal: '0', meta: '100 g · Pepsi zero, PepsiCo, Pepsi, Pepsi Max', img: '../assets/pepsi.png' },
      { id: 'galette', name: 'Galette de riz chocolat', kcal: '499', meta: '100 g · Vitarice', img: '../assets/galette.png' },
      { id: 'oldelpaso', name: 'Old el paso blé nature', kcal: '299', meta: '100 g · Old el paso', img: '../assets/oldelpaso.png' }
    ].map((f) => Object.assign(f, { v: true, h: true }));
    const favs = this.state.favs;
    const list = (this.state.favOnly ? favorites.filter((f) => favs[f.id]) : frequent);
    const on = this.state.favOnly;
    return {
      favOn: on ? 'true' : 'false',
      favBg: on ? '#1db954' : '#F3F6F4',
      favFg: on ? '#FFFFFF' : '#4A5550',
      favFill: on ? '#FFFFFF' : 'none',
      favShadow: on ? '0 8px 18px -8px rgba(23,163,73,.55)' : 'none',
      toggleFav: () => this.setState({ favOnly: !this.state.favOnly }),
      showHabits: !on,
      items: list.map((p, i) => {
        const isFav = !!favs[p.id];
        return {
          name: p.name, kcal: p.kcal, meta: p.meta, img: p.img,
          hasImg: !!p.img, noImg: !p.img,
          verified: p.v,
          hasHeart: p.h, noHeart: !p.h,
          border: i === 0 ? 'none' : '1px solid #EEF1EF',
          heartColor: isFav ? '#1db954' : '#9AA39E',
          heartFill: isFav ? '#1db954' : 'none',
          toggle: () => { const f = Object.assign({}, this.state.favs); f[p.id] = !f[p.id]; this.setState({ favs: f }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
