<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tour de cou</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input,textarea,select{font-family:inherit}
.press{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.press:active{transform:scale(.97)}
.fld:focus-within{border-color:#1db954 !important;box-shadow:0 0 0 4px rgba(29,185,84,.14) !important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes areaIn{from{opacity:0}to{opacity:1}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ringIn{from{stroke-dasharray:0 1000}}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(150px);opacity:0}}
.screen{animation:screenIn .24s ease-out both}
.fx{animation:fadeUp .28s ease-out both}
.sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both}
.scrim{animation:scrimIn .24s ease-out both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:drawIn .9s cubic-bezier(.3,.7,.2,1) .15s both}
.area{animation:areaIn .6s ease-out .45s both}
.hbar{transform-origin:left;animation:barIn .6s cubic-bezier(.2,.8,.2,1) .15s both}
.vbar{transform-origin:bottom;animation:barUp .6s cubic-bezier(.2,.8,.2,1) .15s both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

</style>
</helmet>
<div class="screen" style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#0F1512;font-family:'Lato',system-ui,sans-serif"><div style="padding:52px 20px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5;flex:none"><a class="press" href="Progress.dc.html" style="height:44px;box-sizing:border-box;padding:0 18px 0 10px;border-radius:22px;border:1px solid #E9EDEA;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 20px -8px rgba(15,21,18,.14);display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:#0d7c36"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1db954" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Retour</a><div style="display:flex;align-items:center;gap:10px"><button class="press" aria-label="Actualiser" style="width:44px;height:44px;padding:0;border-radius:22px;border:1px solid #E9EDEA;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 20px -8px rgba(15,21,18,.14);display:flex;align-items:center;justify-content:center;color:#0F1512"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.2L4 9"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.5 4.2L20 15"></path><path d="M20 20v-5h-5"></path></svg></button><button class="press" aria-label="Profil" style="width:44px;height:44px;padding:0;border-radius:22px;border:2px solid #FFFFFF;background:#e8fef0;box-shadow:0 0 0 1px rgba(29,185,84,.3),0 8px 20px -8px rgba(15,21,18,.18);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#0d7c36">HG</button></div></div><div style="flex:1;min-height:0;overflow-y:auto;padding:18px 20px 170px"><div class="fx" style="animation-delay:0ms;display:flex;align-items:center;gap:14px;margin-top:18px"><div style="flex:1;min-width:0;display:flex;align-items:center;gap:14px"><div style="min-width:0"><h1 style="margin:0;font-size:30px;font-weight:900;letter-spacing:-0.03em;line-height:1.1">Tour de cou</h1><div style="margin-top:4px;font-size:14px;line-height:1.4;color:#66716B">Touche une date pour corriger ou supprimer une valeur.</div></div></div></div><div class="fx" style="animation-delay:60ms;margin-top:16px;padding:18px 16px 12px;border-radius:24px;border:1px solid #EEF1EF;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 14px 32px -16px rgba(15,21,18,.18)"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 4px"><div><div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:48px;font-weight:900;letter-spacing:-0.04em;line-height:1">{{big}}</span><span style="font-size:18px;font-weight:700;color:#66716B">{{unit}}</span></div><div style="margin-top:4px;font-size:13.5px;color:#66716B">{{bigDate}}</div></div><div style="text-align:right"><sc-if value="{{hasDiff}}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:6px 11px;font-size:13px;font-weight:900;background:#F3F6F4;color:#2F3A34;font-variant-numeric:tabular-nums"><sc-if value="{{dUp}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></sc-if><sc-if value="{{dDown}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></sc-if><sc-if value="{{dFlat}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></sc-if>{{diffTxt}}</span></sc-if></div></div><div style="position:relative;touch-action:pan-y;margin-top:4px" onMouseMove="{{move}}" onTouchMove="{{move}}" onTouchStart="{{move}}" onMouseLeave="{{leave}}" onTouchEnd="{{leave}}"><svg viewBox="0 0 340 214" width="100%" height="214" style="display:block;overflow:visible" role="img" aria-label="Courbe Tour de cou"><defs><linearGradient id="dNeck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.26"></stop><stop offset="1" stop-color="#3B82F6" stop-opacity="0"></stop></linearGradient></defs><line x1="0" y1="{{y0}}" x2="340" y2="{{y0}}" stroke="#EEF1EF" stroke-width="1" stroke-dasharray="3 5"></line><text x="338" y="{{y0}}" dy="-5" text-anchor="end" font-size="10.5" font-weight="700" fill="#9AA39E">{{g0}}</text><line x1="0" y1="{{y1}}" x2="340" y2="{{y1}}" stroke="#EEF1EF" stroke-width="1" stroke-dasharray="3 5"></line><text x="338" y="{{y1}}" dy="-5" text-anchor="end" font-size="10.5" font-weight="700" fill="#9AA39E">{{g1}}</text><line x1="0" y1="{{y2}}" x2="340" y2="{{y2}}" stroke="#EEF1EF" stroke-width="1" stroke-dasharray="3 5"></line><text x="338" y="{{y2}}" dy="-5" text-anchor="end" font-size="10.5" font-weight="700" fill="#9AA39E">{{g2}}</text><path class="area" d="{{area}}" fill="url(#dNeck)"></path><path class="draw" pathLength="1" d="{{line}}" fill="none" stroke="#3B82F6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><path class="area" d="{{dots}}" fill="none" stroke="#3B82F6" stroke-width="9" stroke-linecap="round"></path><path class="area" d="{{dots}}" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"></path><line x1="{{hx}}" y1="18" x2="{{hx}}" y2="190" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 4" style="transition:x1 .15s ease,x2 .15s ease"></line><circle cx="{{hx}}" cy="{{hy}}" r="12" fill="#3B82F6" fill-opacity="0.18" style="transition:cx .15s ease,cy .15s ease"></circle><circle cx="{{hx}}" cy="{{hy}}" r="7" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2.5" style="transition:cx .15s ease,cy .15s ease"></circle></svg><div aria-live="polite" style="position:absolute;top:{{tipTop}}px;left:{{tipLeft}}%;transform:translate(-50%,-100%);pointer-events:none;padding:7px 12px;border-radius:12px;background:#111A15;color:#FFFFFF;text-align:center;white-space:nowrap;box-shadow:0 12px 24px -10px rgba(15,21,18,.5);transition:left .15s ease,top .15s ease"><div style="font-size:14px;font-weight:900;line-height:1.2">{{tipVal}}</div><div style="font-size:11.5px;color:#C9D0CC;line-height:1.3">{{tipDate}}</div></div></div><div style="display:flex;justify-content:space-between;padding:6px 4px 0;font-size:11.5px;color:#7B857F"><span>{{d0}}</span><span>{{d1}}</span></div></div><div class="fx" style="animation-delay:120ms;margin-top:14px"><a class="press" href="Sheet-Mesures.dc.html" style="display:flex;align-items:center;justify-content:center;width:100%;height:56px;box-sizing:border-box;border-radius:28px;border:0;background:#111A15;color:#FFFFFF;font-size:16px;font-weight:700;box-shadow:0 14px 28px -12px rgba(15,21,18,.5);">Enregistrer une valeur</a></div><div class="fx" style="animation-delay:180ms;margin-top:14px;border-radius:24px;border:1px solid #EEF1EF;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 14px 32px -16px rgba(15,21,18,.18);overflow:hidden"><div style="padding:13px 18px 9px;font-size:15px;font-weight:900;line-height:1">Historique</div><div style="border-top:1px solid #EEF1EF"><sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><button class="press" onClick="{{r.pick}}" aria-label="Voir {{r.date}} sur la courbe" style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 18px;border:0;border-top:{{r.border}};background:{{r.bg}};text-align:left;transition:background-color .2s ease"><span style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;font-weight:700;line-height:1;color:#0F1512">{{r.date}}</span><sc-if value="{{r.edit}}" hint-placeholder-val="{{ true }}"><span role="button" tabindex="0" class="press" aria-label="Corriger ou supprimer" style="width:32px;height:32px;margin-left:2px;padding:0;border-radius:16px;background:#F3F6F4;color:#66716B;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"></path><path d="M13.5 8.5l3 3"></path></svg></span></sc-if></span><span style="display:flex;align-items:center"><span style="font-size:14px;font-weight:900;line-height:1;color:#0F1512">{{r.value}}</span></span></button></sc-for></div></div></div><div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,rgba(255,255,255,0),#FFFFFF 66%);pointer-events:none"></div><nav aria-label="Navigation principale" style="position:absolute;left:20px;right:20px;bottom:28px;height:68px;box-sizing:border-box;padding:6px;border-radius:34px;background:#FFFFFF;border:1px solid #EEF1EF;box-shadow:0 18px 40px -14px rgba(15,21,18,.28),0 2px 6px rgba(15,21,18,.06);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px"><a class="press" href="Home.dc.html" style="border-radius:28px;color:#66716B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"></path></svg>Accueil</a><a class="press" href="Journal.dc.html" style="border-radius:28px;color:#66716B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="13" height="17" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>Journal</a><a class="press" href="Progress.dc.html" aria-current="page" style="border-radius:28px;background:#e8fef0;color:#0d7c36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Progression</a></nav></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hov: null }; }
  monotone(pts) {
    const n = pts.length;
    const dx = [], m = [], t = [];
    for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1].x - pts[i].x; m[i] = (pts[i + 1].y - pts[i].y) / dx[i]; }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) {
      if (m[i - 1] * m[i] <= 0) { t[i] = 0; }
      else { const a = dx[i - 1], b = dx[i]; t[i] = (3 * (a + b)) / ((2 * b + a) / m[i - 1] + (b + 2 * a) / m[i]); }
    }
    let d = 'M' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
    for (let i = 0; i < n - 1; i++) {
      const x0 = pts[i].x, y0 = pts[i].y, x1 = pts[i + 1].x, y1 = pts[i + 1].y, h = dx[i] / 3;
      d += ' C' + (x0 + h).toFixed(1) + ' ' + (y0 + t[i] * h).toFixed(1) + ' ' + (x1 - h).toFixed(1) + ' ' + (y1 - t[i + 1] * h).toFixed(1) + ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1);
    }
    return d;
  }
  renderVals() {
    const PTS = [{t:0,v:30},{t:20,v:33}];
    const UNIT = 'cm', DEC = 0, EDIT = true;
    const W = 340, H = 214, pt = 30, pb = 24, px = 12;
    const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    const base = new Date(2026, 8, 7);
    const dateOf = (t) => { const d = new Date(base.getTime() + t * 86400000); return d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear(); };
    const num = (v) => v.toFixed(DEC).replace('.', ',');
    const t0 = PTS[0].t, t1 = PTS[PTS.length - 1].t;
    let vmin = Math.min.apply(null, PTS.map((p) => p.v)), vmax = Math.max.apply(null, PTS.map((p) => p.v));
    if (vmax - vmin < 1e-9) { vmin -= 1; vmax += 1; }
    const ys = (v) => pt + (1 - (v - vmin) / (vmax - vmin)) * (H - pt - pb);
    const pts = PTS.map((p) => ({ x: px + (p.t - t0) / (t1 - t0) * (W - 2 * px), y: ys(p.v) }));
    const line = this.monotone(pts);
    const last = pts[pts.length - 1];
    const area = line + ' L' + last.x.toFixed(1) + ' ' + (H - pb) + ' L' + pts[0].x.toFixed(1) + ' ' + (H - pb) + ' Z';
    const dots = pts.slice(0, pts.length - 1).map((p) => 'M' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' h0').join(' ');
    const k = this.state.hov === null ? PTS.length - 1 : this.state.hov;
    const hp = pts[k];
    const diff = k > 0 ? PTS[k].v - PTS[k - 1].v : null;
    const move = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const tt = e.touches && e.touches.length ? e.touches[0] : e;
      const x = (tt.clientX - r.left) / r.width * W;
      let best = 0;
      pts.forEach((p, i) => { if (Math.abs(p.x - x) < Math.abs(pts[best].x - x)) best = i; });
      if (this.state.hov !== best) this.setState({ hov: best });
    };
    return {
      line: line, area: area, dots: dots, hx: hp.x.toFixed(1), hy: hp.y.toFixed(1),
      move: move, leave: () => this.setState({ hov: null }),
      tipTop: Math.max(hp.y - 16, 40).toFixed(0), tipLeft: Math.min(Math.max(hp.x / W * 100, 17), 83).toFixed(1),
      tipVal: num(PTS[k].v) + ' ' + UNIT, tipDate: dateOf(PTS[k].t),
      big: num(PTS[k].v), unit: UNIT, bigDate: dateOf(PTS[k].t),
      hasDiff: diff !== null, dUp: diff !== null && diff > 1e-9, dDown: diff !== null && diff < -1e-9, dFlat: diff !== null && Math.abs(diff) <= 1e-9,
      diffTxt: diff === null ? '' : (Math.abs(diff) <= 1e-9 ? '0' : num(Math.abs(diff))) + ' ' + UNIT,
      g0: num(vmax), g1: num((vmax + vmin) / 2), g2: num(vmin), y0: pt, y1: (pt + (H - pb)) / 2, y2: H - pb,
      d0: dateOf(t0), d1: dateOf(t1),
      rows: PTS.map((p, i) => ({ date: dateOf(p.t), value: num(p.v) + ' ' + UNIT, bg: i === k ? '#EEF4FE' : '#FFFFFF', edit: EDIT, border: i ? '1px solid #EEF1EF' : 'none',
        pick: () => this.setState({ hov: i }) }))
    };
  }
}
</script>
