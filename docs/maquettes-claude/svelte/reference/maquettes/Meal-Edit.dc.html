<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier le repas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input{font-family:inherit}
.press{transition:transform .15s ease,box-shadow .2s ease}
.press:active{transform:scale(.97)}
.fld:focus-within{border-color:#1db954 !important;box-shadow:0 0 0 4px rgba(29,185,84,.14) !important}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#0F1512;font-family:'Lato',system-ui,sans-serif">

  <div style="padding:52px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <a class="press" href="Main.dc.html" aria-label="Retour aux repas" style="height:44px;box-sizing:border-box;padding:0 18px 0 10px;border-radius:22px;border:1px solid #E9EDEA;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 20px -8px rgba(15,21,18,.14);display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;color:#0F1512">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1db954" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Repas
    </a>
    <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#66716B">Ajouter un aliment</span>
  </div>

  <div style="padding:16px 20px 2px">
    <h1 style="margin:0;font-size:30px;font-weight:900;letter-spacing:-0.02em;line-height:1.1">Modifier le repas</h1>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;padding:10px 20px 108px;display:flex;flex-direction:column;gap:8px">

    <label class="fld" style="flex:none;display:block;box-sizing:border-box;padding:9px 16px 10px;border-radius:18px;border:1px solid #E9EDEA;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 10px 24px -14px rgba(15,21,18,.14)">
      <span style="display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#66716B">Nom du repas</span>
      <input type="text" value="{{mealName}}" onChange="{{setName}}" placeholder="ex. Hachis parmentier" style="display:block;width:100%;box-sizing:border-box;margin-top:3px;padding:0;border:0;outline:0;background:transparent;font-size:17px;font-weight:700;color:#0F1512">
    </label>

    <label class="fld" style="flex:none;display:block;box-sizing:border-box;padding:9px 16px 10px;border-radius:18px;border:1px solid #E9EDEA;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 10px 24px -14px rgba(15,21,18,.14)">
      <span style="display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#66716B">Description <span style="text-transform:none;letter-spacing:0;font-weight:400">(optionnel)</span></span>
      <input type="text" value="{{mealDesc}}" onChange="{{setDesc}}" placeholder="Ajoute une note" style="display:block;width:100%;box-sizing:border-box;margin-top:3px;padding:0;border:0;outline:0;background:transparent;font-size:16px;color:#0F1512">
    </label>

    <div style="flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
      <div style="padding:8px 4px 7px;border-radius:14px;background:#FFFFFF;border:1px solid #EEF1EF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 18px -14px rgba(15,21,18,.16);text-align:center">
        <span style="display:inline-block;width:6px;height:6px;border-radius:3px;vertical-align:middle;margin-right:4px;background:#1db954"></span>
        <div style="margin-top:3px;font-size:16px;font-weight:900;letter-spacing:-0.01em;line-height:1.1">1 975</div>
        <div style="margin-top:1px;font-size:11px;color:#66716B;line-height:1.2">kcal</div>
      </div>
      <div style="padding:8px 4px 7px;border-radius:14px;background:#FFFFFF;border:1px solid #EEF1EF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 18px -14px rgba(15,21,18,.16);text-align:center">
        <span style="display:inline-block;width:6px;height:6px;border-radius:3px;vertical-align:middle;margin-right:4px;background:#ec4899"></span>
        <div style="margin-top:3px;font-size:16px;font-weight:900;letter-spacing:-0.01em;line-height:1.1">190 <span style="font-size:12px;font-weight:700;color:#66716B">g</span></div>
        <div style="margin-top:1px;font-size:11px;color:#66716B;line-height:1.2">glucides</div>
      </div>
      <div style="padding:8px 4px 7px;border-radius:14px;background:#FFFFFF;border:1px solid #EEF1EF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 18px -14px rgba(15,21,18,.16);text-align:center">
        <span style="display:inline-block;width:6px;height:6px;border-radius:3px;vertical-align:middle;margin-right:4px;background:#3B82F6"></span>
        <div style="margin-top:3px;font-size:16px;font-weight:900;letter-spacing:-0.01em;line-height:1.1">130 <span style="font-size:12px;font-weight:700;color:#66716B">g</span></div>
        <div style="margin-top:1px;font-size:11px;color:#66716B;line-height:1.2">protéines</div>
      </div>
      <div style="padding:8px 4px 7px;border-radius:14px;background:#FFFFFF;border:1px solid #EEF1EF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 8px 18px -14px rgba(15,21,18,.16);text-align:center">
        <span style="display:inline-block;width:6px;height:6px;border-radius:3px;vertical-align:middle;margin-right:4px;background:#F97316"></span>
        <div style="margin-top:3px;font-size:16px;font-weight:900;letter-spacing:-0.01em;line-height:1.1">70 <span style="font-size:12px;font-weight:700;color:#66716B">g</span></div>
        <div style="margin-top:1px;font-size:11px;color:#66716B;line-height:1.2">lipides</div>
      </div>
    </div>
    <div style="flex:none;text-align:center;font-size:12.5px;color:#66716B;margin-top:-2px">Plat entier : <strong style="color:#0F1512">1 900 g</strong></div>

    <div style="flex:none;display:flex;align-items:baseline;justify-content:space-between;margin-top:4px">
      <h2 style="margin:0;font-size:20px;font-weight:900;letter-spacing:-0.01em">Ingrédients</h2>
      <span style="font-size:13px;font-weight:700;color:#66716B">{{count}}</span>
    </div>

    <div role="list" aria-label="Liste des ingrédients" style="flex:1 1 0;min-height:150px;border-radius:20px;border:1px solid #EEF1EF;box-shadow:0 1px 2px rgba(15,21,18,.04),0 12px 28px -14px rgba(15,21,18,.16);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:linear-gradient(#FFFFFF 30%,rgba(255,255,255,0)) top/100% 28px no-repeat local,linear-gradient(rgba(255,255,255,0),#FFFFFF 70%) bottom/100% 28px no-repeat local,radial-gradient(farthest-side at 50% 0,rgba(15,21,18,.12),rgba(15,21,18,0)) top/100% 10px no-repeat scroll,radial-gradient(farthest-side at 50% 100%,rgba(15,21,18,.12),rgba(15,21,18,0)) bottom/100% 10px no-repeat scroll,#FFFFFF">
      <sc-for list="{{ingredients}}" as="ing" hint-placeholder-count="3">
        <div role="listitem" style="display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-top:{{ing.border}}">
          <div style="width:40px;height:40px;border-radius:13px;background:#e8fef0;color:#1db954;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;font-weight:900">{{ing.initial}}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:700;line-height:1.25">{{ing.name}}</div>
            <div style="margin-top:2px;font-size:13px;color:#66716B">{{ing.qty}}</div>
          </div>
          <button class="press" aria-label="Retirer l'ingrédient" onClick="{{ing.remove}}" style="width:36px;height:36px;padding:0;border-radius:12px;border:0;background:#F3F6F4;color:#4A5550;display:flex;align-items:center;justify-content:center;flex:none">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding:22px 20px;text-align:center;font-size:15px;line-height:1.4;color:#66716B">Aucun ingrédient pour l'instant — ajoute des produits ci-dessous.</div>
      </sc-if>
    </div>

    <button class="press" style="flex:none;height:46px;border-radius:18px;border:1.5px solid #1db954;background:#e8fef0;color:#0d7c36;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Ajouter un produit
    </button>

    <button class="press" style="flex:none;height:46px;border-radius:18px;border:1.5px dashed rgba(29,185,84,.3);background:#f3fcf7;color:#0d7c36;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 4.7L17.5 9.5l-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8Z"></path><path d="M18.5 15v5M16 17.5h5"></path></svg>
      Importer une recette avec l'IA
      <span style="font-size:10px;font-weight:900;letter-spacing:.05em;color:#06361B;background:#1db954;border-radius:6px;padding:2px 6px">BÊTA</span>
    </button>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:34px 20px 30px;box-sizing:border-box;background:linear-gradient(to bottom,rgba(255,255,255,0),#FFFFFF 42%)">
    <a class="press" href="Main.dc.html" style="height:58px;border-radius:29px;background:#1db954;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 30px -12px rgba(23,163,73,.65)">Enregistrer le repas</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Hachis Parmentier', desc: '', removed: [] };
  }
  renderVals() {
    const all = [
      { id: 'pdt', name: 'Purée de pommes de terre', qty: '1 000 g' },
      { id: 'boeuf', name: 'Bœuf haché', qty: '600 g' },
      { id: 'oignon', name: 'Oignons', qty: '300 g' }
    ];
    const removed = this.state.removed;
    const list = all.filter((i) => removed.indexOf(i.id) === -1);
    return {
      mealName: this.state.name,
      mealDesc: this.state.desc,
      setName: (e) => this.setState({ name: e.target.value }),
      setDesc: (e) => this.setState({ desc: e.target.value }),
      count: list.length + (list.length > 1 ? ' produits' : ' produit'),
      empty: list.length === 0,
      ingredients: list.map((i, idx) => ({
        ...i,
        initial: i.name.charAt(0),
        border: idx === 0 ? 'none' : '1px solid #EEF1EF',
        remove: () => this.setState({ removed: removed.concat([i.id]) })
      }))
    };
  }
}
</script>
</body>
</html>
