<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Enregistrer mon poids</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input,textarea,select{font-family:inherit}
.press{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.press:active{transform:scale(.97)}
.fld:focus-within{border-color:#1db954 !important;box-shadow:0 0 0 4px rgba(29,185,84,.14) !important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes areaIn{from{opacity:0}to{opacity:1}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ringIn{from{stroke-dasharray:0 1000}}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(150px);opacity:0}}
.screen{animation:screenIn .24s ease-out both}
.fx{animation:fadeUp .28s ease-out both}
.sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both}
.scrim{animation:scrimIn .24s ease-out both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:drawIn .9s cubic-bezier(.3,.7,.2,1) .15s both}
.area{animation:areaIn .6s ease-out .45s both}
.hbar{transform-origin:left;animation:barIn .6s cubic-bezier(.2,.8,.2,1) .15s both}
.vbar{transform-origin:bottom;animation:barUp .6s cubic-bezier(.2,.8,.2,1) .15s both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

</style>
</helmet>
<div class="screen" style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#0F1512;font-family:'Lato',system-ui,sans-serif"><div aria-hidden="true" style="position:absolute;inset:0;background:#FFFFFF;filter:blur(7px);transform:scale(1.04)"><div style="position:absolute;left:20px;top:60px;width:150px;height:32px;border-radius:16px;background:#E3E8E5"></div><div style="position:absolute;left:20px;top:130px;width:230px;height:34px;border-radius:10px;background:#D6DCD8"></div><div style="position:absolute;left:20px;right:20px;top:200px;height:170px;border-radius:24px;background:#EEF1EF"></div><div style="position:absolute;left:20px;right:20px;top:390px;height:190px;border-radius:24px;background:#e8fef0"></div></div><div class="scrim" style="position:absolute;inset:0;background:rgba(15,21,18,.38)"></div><div class="sheet" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:22px 20px 28px;border-radius:30px 30px 0 0;background:#FFFFFF;box-shadow:0 -20px 50px -20px rgba(15,21,18,.35)"><div style="display:flex;align-items:flex-start;justify-content:space-between"><div><div style="font-size:20px;font-weight:900;letter-spacing:-0.02em">Enregistrer mon poids</div></div><a class="press" href="Progress.dc.html" aria-label="Fermer" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#66716B;flex:none;margin:-6px -8px 0 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a></div><div style="margin-top:18px;font-size:11.5px;font-weight:900;letter-spacing:.1em;color:#7B857F">DATE</div><label class="fld" style="margin-top:8px;display:flex;align-items:center;height:52px;box-sizing:border-box;padding:0 16px;border-radius:16px;border:1.5px solid #E3E8E5;background:#F6F8F6"><input type="date" value="2026-10-13" aria-label="Date" style="flex:1;border:0;outline:0;background:transparent;font-size:16px;font-weight:700;color:#0F1512"></label><div style="margin-top:14px;display:flex;flex-direction:column;gap:10px"><label class="fld" style="display:flex;align-items:center;gap:12px;height:56px;box-sizing:border-box;padding:0 16px;border-radius:18px;border:1.5px solid #E3E8E5;background:#FFFFFF"><span style="color:#1db954;display:flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="4"></rect><path d="M8 9.5a5 4 0 0 1 8 0M12 9.5l1.800-1.800"></path></svg></span><span style="flex:1;font-size:16px;font-weight:900">Poids</span><input type="text" inputmode="decimal" value="{{value}}" onChange="{{set}}" placeholder="—" aria-label="Poids en kilogrammes" style="width:64px;border:0;outline:0;background:transparent;text-align:right;font-size:18px;font-weight:900;color:#0F1512"><span style="font-size:14px;color:#7B857F;width:22px">kg</span></label></div><div style="margin-top:18px"><a class="press" href="Progress.dc.html" style="display:flex;align-items:center;justify-content:center;width:100%;height:56px;box-sizing:border-box;border-radius:28px;border:0;background:#111A15;color:#FFFFFF;font-size:16px;font-weight:700;box-shadow:0 14px 28px -12px rgba(15,21,18,.5);">Enregistrer le poids</a></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: '' }; }
  renderVals() {
    return { value: this.state.v, set: (e) => this.setState({ v: e.target.value.replace(/[^0-9,\.]/g, '') }) };
  }
}
</script>
</body>
</html>
