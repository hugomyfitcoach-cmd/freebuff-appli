# Déploiement Netlify — SvelteKit (adapter-netlify)
# La fonction SSR (.netlify/functions-internal) est détectée automatiquement.
[build]
  command = "npm run build"
  publish = "build"

# ── Deploy Previews — workflow officiel Convex × Netlify ─────────────────
# La PREVIEW deploy key (Netlify, scope Deploy Previews uniquement) fait :
#   1. SUPPRIMER ET RECRÉER le Convex Preview « alimentation-ia-preview » ;
#   2. y pousser le schéma + fonctions (seed automatique via --preview-run) ;
#   3. injecter l'URL du backend preview dans le build via PUBLIC_CONVEX_URL
#      (--cmd-url-env-var-name) — aucune config manuelle d'URL.
# POURQUOI --preview-create (et pas --preview-name) : --preview-run ne
# s'exécute QUE SI le déploiement preview est CRÉÉ (doc Convex) ; avec
# --preview-name un preview existant est réutilisé et le seed est IGNORÉ
# silencieusement (bug vécu : comptes de test jamais créés → login 401).
# --preview-create garantit un état propre et seedé à CHAQUE build (données
# de test réinitialisées — voulu pour la phase de test).
# Garde-fous runtime : scripts/build-preview.mjs refuse toute preview dont
# l'URL/clé ressemblerait à la production (calm-jaguar-475).
# PRODUCTION : inchangée ci-dessus (npm run build, sans convex deploy — le
# déploiement Convex prod reste manuel via scripts/deploy.mjs).
[context.deploy-preview]
  command = "npx convex deploy --preview-create alimentation-ia-preview --preview-run previewSeed:seedPreviewData --cmd-url-env-var-name PUBLIC_CONVEX_URL --cmd 'npm run build'"

[context.branch-deploy]
  command = "npx convex deploy --preview-create alimentation-ia-preview --preview-run previewSeed:seedPreviewData --cmd-url-env-var-name PUBLIC_CONVEX_URL --cmd 'npm run build'"

# Diagnostic/réparation preview (URL backend réelle + seed self-healing) —
# activé UNIQUEMENT en contexte preview (jamais en production).
[context.deploy-preview.environment]
  PREVIEW_DIAG = "1"
[context.branch-deploy.environment]
  PREVIEW_DIAG = "1"

# ── Politique de cache ─────────────────────────────────────────────────────
# ROOT CAUSE corrigée (PWA restées des JOURS sur l'ancienne version) :
# sans règles explicites, rien ne garantissait la fraîcheur de l'app shell.
#
# IMPORTANT (docs Netlify) : ces règles ne s'appliquent qu'aux fichiers
# statiques servis du stockage Netlify. Les pages SSR (HTML) et les routes
# /api/* passent par la fonction SvelteKit : leurs en-têtes sont posés par
# le code lui-même — src/hooks.server.ts (HTML : no-cache must-revalidate)
# et src/routes/api/app/version/+server.ts (no-store, signal de détection).
#
# - /_app/immutable/ : assets hashés par le build → cache IMMUTABLE d'un an
#   (le HTML de la nouvelle version référence toujours de nouvelles
#   empreintes ; les anciennes restent valides pour les pages déjà ouvertes,
#   donc aucune PWA ne casse pendant la transition) ;
# - /service-worker.js et les fichiers statiques (manifest, icônes…) :
#   revalidation à chaque requête → le navigateur détecte toujours un nouveau
#   worker dès qu'il existe ;
# - la règle /api/app/version ci-dessous est un filet (le header réel vient
#   du code, voir ci-dessus).
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/app/version"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
